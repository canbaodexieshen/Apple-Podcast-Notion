name: Sync podcast data and progress
on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'
permissions:
  contents: read
concurrency:
  group: apple-podcasts-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.SYNC_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APPLE_BEARER_TOKEN: ${{ secrets.APPLE_BEARER_TOKEN }}
      APPLE_MEDIA_USER_TOKEN: ${{ secrets.APPLE_MEDIA_USER_TOKEN }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sync metadata and listening progress
        run: python -u scripts/sync.py
