name: Targeted AI diagnosis and recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/diagnose_ai.py
      - .github/workflows/ai-recovery.yml
permissions:
  contents: read
concurrency:
  group: apple-podcasts-sync
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-ai]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
      AI_MAX_EPISODES: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Probe audio access and resume saved AI checkpoints
        run: python -u scripts/diagnose_ai.py --recover
