name: Verify complete podcast sync
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-full.yml
      - scripts/sync.py
permissions:
  contents: read
concurrency:
  group: apple-podcasts-sync
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[verify-full]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PAGE: ${{ secrets.NOTION_PAGE }}
      APPLE_BEARER_TOKEN: ${{ secrets.APPLE_BEARER_TOKEN }}
      APPLE_MEDIA_USER_TOKEN: ${{ secrets.APPLE_MEDIA_USER_TOKEN }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
      AI_MAX_EPISODES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci && npm run build
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk ffmpeg
      - name: Sync all basic data and verify one pending AI episode
        run: python -u scripts/sync.py
      - name: Read back native headings, mentions, covers, dates and relations
        run: python -u scripts/verify_layout.py
      - name: Repeat migration to verify resume without AI or duplicate records
        run: python -u scripts/upgrade_library.py
      - run: python -u scripts/verify_layout.py
